name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # python-for-android installs pure-Python packages with the host pip. Without this,
      # pip picks x86-64 wheels whose compiled modules crash on the phone at import time.
      PIP_NO_BINARY: fonttools,chardet
      FONTTOOLS_WITH_CYTHON: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang paket sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache \
            libltdl-dev autoconf-archive gettext

      - name: Pasang Buildozer
        run: pip install --upgrade pip setuptools wheel buildozer cython==0.29.36

      - name: Ambil cache SDK, NDK, dan hasil build
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-v2-${{ hashFiles('buildozer.spec') }}-
            buildozer-v2-

      - name: Build APK debug
        run: buildozer -v android debug < <(yes) 2>&1 | tee build.log
        shell: bash -o pipefail {0}

      - name: Periksa library native di APK
        run: |
          apk=$(ls bin/*.apk | head -n 1)
          work=$(mktemp -d)
          unzip -q "$apk" -d "$work"
          mkdir "$work/bundle"
          tar xzf "$work/lib/arm64-v8a/libpybundle.so" -C "$work/bundle"
          bad=$(find "$work/bundle" -name '*.so' -exec file {} + | grep -v 'ARM aarch64' || true)
          if [ -n "$bad" ]; then
            echo "Library berikut bukan ARM64 dan akan membuat aplikasi macet di Loading:"
            echo "$bad"
            exit 1
          fi
          echo "Semua library native sudah ARM64."

      # Simpan cache walaupun build gagal, agar percobaan berikutnya tidak mengunduh ulang SDK/NDK
      - name: Simpan cache SDK, NDK, dan hasil build
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Tampilkan penyebab gagal
        if: failure()
        run: |
          echo "===== 200 baris terakhir log build ====="
          tail -n 200 build.log || true

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log

      - name: Simpan APK
        uses: actions/upload-artifact@v6
        with:
          name: kossplit-apk
          path: bin/*.apk
