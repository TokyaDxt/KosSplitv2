[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kossplit"
version = "0.1.0"
description = "Aplikasi split bill dan pencatat pengeluaran Android berbasis Python"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["kossplit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
