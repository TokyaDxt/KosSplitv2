name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kossplit_android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_NO_BINARY: fonttools,chardet
      FONTTOOLS_WITH_CYTHON: "0"

    defaults:
      run:
        working-directory: kossplit_android

    steps:
      - name: Ambil source code
        uses: actions/checkout@v5

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Siapkan Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang paket sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ccache libltdl-dev autoconf-archive gettext

      - name: Pasang Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Ambil cache SDK dan NDK
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.buildozer
            kossplit_android/.buildozer
          key: buildozer-v3-${{ hashFiles('kossplit_android/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-v3-${{ hashFiles('kossplit_android/buildozer.spec') }}-
            buildozer-v3-

      - name: Build APK debug
        run: buildozer -v android debug < <(yes) 2>&1 | tee build.log
        shell: bash -o pipefail {0}

      - name: Periksa library native
        run: |
          apk=$(ls bin/*.apk | head -n 1)
          work=$(mktemp -d)
          unzip -q "$apk" -d "$work"
          mkdir "$work/bundle"
          tar xzf "$work/lib/arm64-v8a/libpybundle.so" -C "$work/bundle"
          bad=$(find "$work/bundle" -name '*.so' -exec file {} + | grep -v 'ARM aarch64' || true)
          if [ -n "$bad" ]; then
            echo "Library berikut bukan ARM64:"
            echo "$bad"
            exit 1
          fi
          echo "Semua library native sudah ARM64."

      - name: Simpan cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.buildozer
            kossplit_android/.buildozer
          key: buildozer-v3-${{ hashFiles('kossplit_android/buildozer.spec') }}-${{ github.run_id }}

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: kossplit_android/build.log

      - name: Simpan APK
        uses: actions/upload-artifact@v6
        with:
          name: kossplit-apk
          path: kossplit_android/bin/*.apk
